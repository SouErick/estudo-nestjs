<div style="max-width:600px; margin:40px auto; padding:2rem;">

  <div style="display:flex; justify-content:space-between; align-items:center;">
    <h2>FileVault — Meus Arquivos</h2>
    <div>
      <button (click)="loadFiles()" style="margin-right:8px;">Recarregar</button>
      <button (click)="logout()">Sair</button>
    </div>
  </div>

  <!-- feedback -->
  <div *ngIf="message" style="color:green; margin:1rem 0;">{{ message }}</div>
  <div *ngIf="error"   style="color:red;   margin:1rem 0;">{{ error }}</div>

  <!-- upload -->
  <div style="margin:1.5rem 0; display:flex; align-items:center; gap:1rem;">
    <label>Enviar arquivo:</label>
    <input #fileInput
      type="file"
      (change)="onFileSelected($event)"
      [disabled]="uploading"
      style="flex:1"/>
    <span *ngIf="uploading">enviando...</span>
    <span *ngIf="!uploading && message" style="color:green;">{{ message }}</span>
  </div>

  <!-- lista -->
  <table *ngIf="files.length > 0" style="width:100%; border-collapse:collapse;">
    <thead>
      <tr style="background:#f0f0f0;">
        <th style="text-align:left; padding:8px;">Arquivo</th>
        <th style="text-align:right; padding:8px;">Tamanho</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let f of files" style="border-bottom:1px solid #eee;">
        <td style="padding:8px;">{{ f.Key }}</td>
        <td style="padding:8px; text-align:right;">{{ f.Size }} bytes</td>
      </tr>
    </tbody>
  </table>

  <p *ngIf="files.length === 0 && !error">Nenhum arquivo encontrado.</p>

</div>
