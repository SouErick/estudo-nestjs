<div style="max-width:400px; margin:100px auto; padding:2rem;">
  <h2>FileVault — Login</h2>

  <div *ngIf="error" style="color:red; margin-bottom:1rem;">{{ error }}</div>

  <label>Email</label>
  <input type="email" [(ngModel)]="email"
    style="display:block; width:100%; margin-bottom:1rem;"/>

  <label>Senha</label>
  <input type="password" [(ngModel)]="password"
    style="display:block; width:100%; margin-bottom:1rem;"/>

  <button (click)="onSubmit()">Entrar</button>
</div>
